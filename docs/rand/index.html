<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ACT Timestamp Randomizer</title>
  <style>
    :root {
      --green50: rgba(0, 180, 0, 0.5);
      --text: #f5f7fa;
      --shadow: rgba(0, 0, 0, 0.6);
      --panel: rgba(0, 0, 0, 0.25);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "JetBrains Mono", "Fira Code", "Menlo", monospace;
      color: var(--text);
      background: linear-gradient(var(--green50), var(--green50));
      overflow: hidden;
      position: relative;
    }

    #timestamp-bg {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(28px, 7vw, 92px);
      font-weight: 700;
      letter-spacing: 0.04em;
      color: rgba(190, 255, 205, 0.86);
      text-shadow: 0 0 10px rgba(25, 120, 50, 0.55), 0 0 24px rgba(170, 255, 190, 0.45);
      user-select: none;
      z-index: 0;
      white-space: nowrap;
      padding: 0 16px;
      text-align: center;
    }

    .content {
      position: relative;
      z-index: 1;
      height: 100vh;
      display: grid;
      grid-template-rows: 1fr 1fr;
      backdrop-filter: blur(1px);
    }

    .half {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: var(--panel);
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    }

    .half:last-child {
      border-bottom: none;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
    }

    #dice {
      font-size: clamp(72px, 20vw, 220px);
      font-weight: 800;
      line-height: 1;
      text-shadow: 0 6px 18px var(--shadow);
    }

    #shuffle {
      font-size: clamp(20px, 3.4vw, 44px);
      font-weight: 600;
      letter-spacing: 0.08em;
      word-break: break-all;
      text-align: center;
      max-width: min(95vw, 1400px);
      text-shadow: 0 4px 12px var(--shadow);
    }
  </style>
</head>
<body>
  <div id="timestamp-bg"></div>
  <div class="content">
    <section class="half">
      <div id="dice"></div>
    </section>
    <section class="half">
      <div id="shuffle"></div>
    </section>
  </div>

  <script>
    const timestampEl = document.getElementById("timestamp-bg");
    const diceEl = document.getElementById("dice");
    const shuffleEl = document.getElementById("shuffle");
    const baseChars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
    const actFormatter = new Intl.DateTimeFormat("en-CA", {
      timeZone: "Australia/Adelaide",
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit",
      hour12: false
    });

    let serverOffsetMs = 0;
    let lastSlotKey = "";

    function getCorrectedNow() {
      return new Date(Date.now() + serverOffsetMs);
    }

    function formatActParts(date) {
      const parts = actFormatter.formatToParts(date);
      const map = {};
      for (const part of parts) {
        if (part.type !== "literal") {
          map[part.type] = part.value;
        }
      }
      return map;
    }

    function formatActTimestamp(date) {
      const p = formatActParts(date);
      return `${p.year}-${p.month}-${p.day}T${p.hour}:${p.minute}:${p.second}`;
    }

    function hashString(str) {
      let h = 2166136261;
      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return h >>> 0;
    }

    function mulberry32(seed) {
      let t = seed >>> 0;
      return function() {
        t += 0x6D2B79F5;
        let x = Math.imul(t ^ (t >>> 15), 1 | t);
        x ^= x + Math.imul(x ^ (x >>> 7), 61 | x);
        return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
      };
    }

    function fisherYatesShuffle(str, randomFn) {
      const arr = str.split("");
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(randomFn() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr.join("");
    }

    function getSlotKey(date) {
      const p = formatActParts(date);
      const sec5 = String(Math.floor(Number(p.second) / 5) * 5).padStart(2, "0");
      return `${p.year}${p.month}${p.day}${p.hour}${p.minute}${sec5}`;
    }

    function updateTimestamp() {
      timestampEl.textContent = formatActTimestamp(getCorrectedNow());
    }

    function updateRandomsForSlot(slotKey) {
      const random = mulberry32(hashString(`act-slot-${slotKey}`));
      diceEl.textContent = String(Math.floor(random() * 6) + 1);
      shuffleEl.textContent = fisherYatesShuffle(baseChars, random);
    }

    function tick() {
      const now = getCorrectedNow();
      updateTimestamp();
      const slotKey = getSlotKey(now);
      if (slotKey !== lastSlotKey) {
        lastSlotKey = slotKey;
        updateRandomsForSlot(slotKey);
      }
    }

    async function syncServerTime() {
      try {
        const response = await fetch(window.location.href, {
          method: "HEAD",
          cache: "no-store"
        });
        const dateHeader = response.headers.get("Date");
        if (!dateHeader) {
          return;
        }
        const serverMs = Date.parse(dateHeader);
        if (Number.isNaN(serverMs)) {
          return;
        }
        serverOffsetMs = serverMs - Date.now();
      } catch (error) {
        // If time sync fails, page continues with local clock.
      }
    }

    async function init() {
      await syncServerTime();
      tick();
      setInterval(tick, 1000);
      setInterval(syncServerTime, 60000);
    }

    init();
  </script>
</body>
</html>
