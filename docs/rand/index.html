<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ACT Timestamp Randomizer</title>
  <style>
    :root {
      --green50: rgba(0, 180, 0, 0.5);
      --text: #f5f7fa;
      --shadow: rgba(0, 0, 0, 0.6);
      --panel: rgba(0, 0, 0, 0.25);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "JetBrains Mono", "Fira Code", "Menlo", monospace;
      color: var(--text);
      background: linear-gradient(var(--green50), var(--green50));
      overflow: hidden;
      position: relative;
    }

    #timestamp-bg {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(28px, 7vw, 92px);
      font-weight: 700;
      letter-spacing: 0.04em;
      color: rgba(190, 255, 205, 0.86);
      text-shadow: 0 0 10px rgba(25, 120, 50, 0.55), 0 0 24px rgba(170, 255, 190, 0.45);
      user-select: none;
      z-index: 0;
      white-space: nowrap;
      padding: 0 16px;
      text-align: center;
    }

    .content {
      position: relative;
      z-index: 1;
      height: 100vh;
      display: grid;
      grid-template-rows: 1fr 1fr;
      backdrop-filter: blur(1px);
    }

    .half {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: var(--panel);
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    }

    .half:last-child {
      border-bottom: none;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
    }

    #dice {
      font-size: clamp(72px, 20vw, 220px);
      font-weight: 800;
      line-height: 1;
      text-shadow: 0 6px 18px var(--shadow);
    }

    #shuffle {
      font-size: clamp(20px, 3.4vw, 44px);
      font-weight: 600;
      letter-spacing: 0.08em;
      word-break: break-all;
      text-align: center;
      max-width: min(95vw, 1400px);
      text-shadow: 0 4px 12px var(--shadow);
    }
  </style>
</head>
<body>
  <div id="timestamp-bg">Loading online time...</div>

  <div class="content">
    <section class="half">
      <div id="dice"></div>
    </section>
    <section class="half">
      <div id="shuffle"></div>
    </section>
  </div>

  <script>
    const timestampEl = document.getElementById("timestamp-bg");
    const diceEl = document.getElementById("dice");
    const shuffleEl = document.getElementById("shuffle");

    const baseChars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";

    let serverBaseMs = 0;
    let performanceBaseMs = 0;
    let timeReady = false;
    let onlineTimeOk = false;
    let lastSlotKey = "";

    function getCorrectedNow() {
      return new Date(serverBaseMs + (performance.now() - performanceBaseMs));
    }

    function pad2(num) {
      return String(num).padStart(2, "0");
    }

    function formatActParts(date) {
      return {
        year: String(date.getFullYear()),
        month: pad2(date.getMonth() + 1),
        day: pad2(date.getDate()),
        hour: pad2(date.getHours()),
        minute: pad2(date.getMinutes()),
        second: pad2(date.getSeconds())
      };
    }

    function formatActTimestamp(date) {
      const p = formatActParts(date);
      return `${p.year}-${p.month}-${p.day}T${p.hour}:${p.minute}:${p.second}`;
    }

    function hashString(str) {
      let h = 2166136261;

      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }

      return h >>> 0;
    }

    function mulberry32(seed) {
      let t = seed >>> 0;

      return function() {
        t += 0x6D2B79F5;
        let x = Math.imul(t ^ (t >>> 15), 1 | t);
        x ^= x + Math.imul(x ^ (x >>> 7), 61 | x);
        return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
      };
    }

    function fisherYatesShuffle(str, randomFn) {
      const arr = str.split("");

      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(randomFn() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }

      return arr.join("");
    }

    function getSlotKey(date) {
      const p = formatActParts(date);
      const sec5 = String(Math.floor(Number(p.second) / 5) * 5).padStart(2, "0");
      return `${p.year}${p.month}${p.day}${p.hour}${p.minute}${sec5}`;
    }

    function updateTimestamp() {
      timestampEl.textContent = formatActTimestamp(getCorrectedNow());
    }

    function updateRandomsForSlot(slotKey) {
      const random = mulberry32(hashString(`act-slot-${slotKey}`));
      diceEl.textContent = String(Math.floor(random() * 6) + 1);
      shuffleEl.textContent = fisherYatesShuffle(baseChars, random);
    }

    function tick() {
      if (!timeReady || !onlineTimeOk) {
        timestampEl.textContent = "Load time failed";
        return;
      }

      const now = getCorrectedNow();

      updateTimestamp();

      const slotKey = getSlotKey(now);

      if (slotKey !== lastSlotKey) {
        lastSlotKey = slotKey;
        updateRandomsForSlot(slotKey);
      }
    }

    async function syncServerTime() {
      try {
        const response = await fetch("https://time.now/developer/api/timezone/Australia/Adelaide", {
          cache: "no-store"
        });

        if (!response.ok) {
          onlineTimeOk = false;
          timestampEl.textContent = "Load time failed";
          return;
        }

        const data = await response.json();
        const serverMs = Date.parse(data.datetime);

        if (!Number.isNaN(serverMs)) {
          serverBaseMs = serverMs;
          performanceBaseMs = performance.now();
          timeReady = true;
          onlineTimeOk = true;
        } else {
          onlineTimeOk = false;
          timestampEl.textContent = "Load time failed";
        }
      } catch (error) {
        onlineTimeOk = false;
        timestampEl.textContent = "Load time failed";
      }
    }

    async function init() {
      await syncServerTime();

      tick();

      setInterval(tick, 1000);
      setInterval(syncServerTime, 5000);
    }

    init();
  </script>
</body>
</html>
